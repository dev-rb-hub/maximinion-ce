version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Catches exactly this class of issue: actions falling behind a runner-side
    # Node runtime deprecation (see github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners).
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # One PR per week instead of one per package, so CI/CodeQL don't fan out
    # into a pile of simultaneous runs across separate dependabot branches.
    groups:
      npm-dependencies:
        patterns:
          - "*"
