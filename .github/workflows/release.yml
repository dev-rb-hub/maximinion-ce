name: Release

# Stages @maximinion/* packages on npm for review (NPM_TOKEN is a stage-only
# token). Triggered manually or by pushing a `v*` tag. After a run completes,
# a maintainer must review and promote each staged version locally with 2FA:
#   npm stage list
#   npm stage approve <stage-id> --otp <code>

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run test --workspaces --if-present

      # `npm stage` requires npm CLI >=11.5.1; Node 20.x bundles an older npm.
      - run: npm install -g npm@latest
      - run: npm --version

      # Staged in dependency order: refiner has no internal deps, each
      # subsequent package depends on the ones before it. Each stage requires
      # maintainer approval (npm stage approve) before it goes live.
      - name: Stage packages for review
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage publish --workspace packages/refiner
          npm stage publish --workspace packages/librarian
          npm stage publish --workspace packages/manifest-generator
          npm stage publish --workspace packages/proxy-transport
