name: VS Code Extension Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package (for example, 0.1.1)
        required: true
        type: string
      publish:
        description: Publish this version to the Visual Studio Marketplace
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vscode-extension-release
  cancel-in-progress: false

jobs:
  package:
    # workflow_dispatch requires write access; reject non-CODEOWNER and non-main runs before any steps execute.
    if: ${{ github.actor == 'dev-rb-hub' && github.triggering_actor == 'dev-rb-hub' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm test

      - name: Package VSIX
        working-directory: packages/vscode-extension
        env:
          EXTENSION_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$EXTENSION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use major.minor.patch format"
            exit 1
          fi
          npx vsce package "$EXTENSION_VERSION" --no-dependencies --no-git-tag-version

      - name: Attest VSIX build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/vscode-extension/*.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: maximinion-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30

      # Tags the packaged commit and records a prerelease so GitHub tracks
      # this VSIX build (and its provenance attestation) even before/without
      # a Marketplace publish. Mirrors the staged/promoted pattern used for
      # the @maximinion/* npm packages (release.yml / npm-release-promote.yml).
      - name: Tag and draft-release packaged VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION_VERSION: ${{ inputs.version }}
        run: |
          tag="vscode-extension-v${EXTENSION_VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          notes=$(printf '📦 **Packaged** — pending Marketplace publish approval.\n\n- Extension: `maximinion.maximinion@%s`\n- Provenance: verify the attached VSIX with `gh attestation verify <file> -R %s`\n- Workflow run: %s/%s/actions/runs/%s' \
            "$EXTENSION_VERSION" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh release create "$tag" packages/vscode-extension/*.vsix \
            --title "MaxiMinion VS Code Extension v${EXTENSION_VERSION}" \
            --notes "$notes" \
            --prerelease

  publish:
    needs: package
    if: ${{ inputs.publish && github.actor == 'dev-rb-hub' && github.triggering_actor == 'dev-rb-hub' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: write
      deployments: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: maximinion-vsix
          path: packages/vscode-extension/release-artifacts

      - name: Publish approved VSIX
        working-directory: packages/vscode-extension
        env:
          EXTENSION_VERSION: ${{ inputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::error::Configure the VSCE_PAT secret on the vscode-marketplace environment before publishing"
            exit 1
          fi
          npx vsce publish --packagePath "release-artifacts/maximinion-$EXTENSION_VERSION.vsix" --no-dependencies

      # Flips the prerelease created by the package job to a full release,
      # so the GitHub Release status always reflects Marketplace truth.
      - name: Promote GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION_VERSION: ${{ inputs.version }}
        run: |
          tag="vscode-extension-v${EXTENSION_VERSION}"
          notes=$(printf '✅ **Published** to the Visual Studio Marketplace.\n\n- https://marketplace.visualstudio.com/items?itemName=maximinion.maximinion\n- Version: %s' "$EXTENSION_VERSION")
          gh release edit "$tag" --prerelease=false --notes "$notes"
